<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Akademik Sekolah</title>
<style>
:root{--green:#0f6b57;--deep:#0b3b31;--gold:#f5b83d;--bg:#f4f7f6;--ink:#172b25;--muted:#71817b;--line:#e2e9e6;--white:#fff;--red:#c34e4e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px "Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:white;font-weight:600}button:hover{filter:brightness(.94)}button.secondary{background:#e9f2ef;color:var(--green)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dfda;border-radius:8px;background:#fff;color:var(--ink);outline-color:var(--green)}label{display:block;color:#596a63;font-size:12px;font-weight:600;margin:12px 0 6px}.auth{min-height:100vh;display:grid;grid-template-columns:40% 60%;background:#fff}.brand{background:var(--green);color:white;padding:42px;display:flex;flex-direction:column;justify-content:space-between}.brand h1{font-size:34px;line-height:1.25;max-width:380px}.brand p{color:#d0e8df;line-height:1.7}.brandmark{font-weight:800;font-size:20px}.brandmark b{display:inline-grid;place-items:center;background:var(--gold);color:var(--deep);width:38px;height:38px;border-radius:10px;margin-right:10px}.authmain{display:grid;place-items:center;padding:30px}.authcard{width:min(430px,100%)}.authcard h2{font-size:27px;margin-bottom:5px}.muted{color:var(--muted)}.authcard .hint{font-size:13px;line-height:1.6}.authcard button.primary{width:100%;margin-top:20px;padding:13px}.link{color:var(--green);font-weight:600;cursor:pointer}.app{display:none;min-height:100vh}.sidebar{width:245px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:22px 14px;display:flex;flex-direction:column;z-index:3}.logo{font-size:19px;font-weight:800;padding:4px 10px 26px;color:var(--deep)}.logo b{display:inline-grid;place-items:center;background:var(--gold);width:34px;height:34px;border-radius:9px;margin-right:8px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#9aa7a1;padding:8px 12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;color:#64746d;padding:11px 12px;margin:2px 0;font-weight:500}.nav button.active,.nav button:hover{background:#eaf4f0;color:var(--green)}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebarbottom{margin-top:auto}.main{margin-left:245px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:2}.search{max-width:340px}.user{display:flex;align-items:center;gap:11px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e5f1ec;color:var(--green);font-weight:800}.user small{display:block;color:var(--muted);margin-top:3px}.content{padding:30px 32px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:15px}.pagehead h1{font-size:25px;margin:0 0 6px}.pagehead p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px}.stat .label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin:9px 0 4px}.stat small{color:var(--green)}.cols{grid-template-columns:1.5fr 1fr}.panel h3{font-size:16px;margin:0 0 16px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panelhead h3{margin:0}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#819089;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:#f8faf9}th,td{padding:12px 10px;border-bottom:1px solid #edf1ef}td{font-size:13px}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e9f5ef;color:#19704f;font-size:11px;font-weight:700}.pill.warn{background:#fff5df;color:#986b12}.pill.bad{background:#fff0f0;color:#b34848}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#f0f4f2;color:#62716a}.tabs button.active{background:var(--green);color:white}.actions{display:flex;gap:7px;align-items:center}.actions button{padding:7px 10px;font-size:12px}.notice{padding:13px 15px;border-radius:9px;background:#fff7e5;color:#795b1b;margin:12px 0;line-height:1.5}.schedule{display:grid;grid-template-columns:75px repeat(5,minmax(115px,1fr));gap:7px;overflow:auto}.schedule div{padding:10px;border-radius:8px;background:#f5f8f6;min-height:66px}.schedule .day{background:#eaf3ef;color:var(--green);font-weight:700;text-align:center;min-height:auto}.schedule .time{background:transparent;color:var(--muted);font-weight:700}.lesson{background:#e8f4ef!important;border-left:3px solid var(--green);font-weight:700}.lesson small{display:block;color:var(--muted);font-weight:400;margin-top:5px}.fieldrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.modalback{display:none;position:fixed;inset:0;background:#10251f77;z-index:10;place-items:center;padding:20px}.modal{background:white;border-radius:14px;padding:23px;width:min(480px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;background:#153f34;color:white;padding:13px 18px;border-radius:9px;display:none;z-index:20;box-shadow:0 8px 30px #0002}.empty{text-align:center;color:var(--muted);padding:30px}.messagebox{height:280px;overflow:auto;background:#f8faf9;padding:15px;border-radius:10px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:78%;padding:10px 13px;border-radius:12px;background:white;align-self:flex-start}.bubble.mine{background:#e3f2eb;align-self:flex-end}.progress{height:8px;background:#edf2ef;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}@media(max-width:900px){.sidebar{width:72px;padding:15px 8px}.logo{font-size:0;padding:5px}.logo b{margin:0}.navlabel,.nav button .navtext,.sidebarbottom .navtext{display:none}.nav button{justify-content:center}.main{margin-left:72px}.content{padding:22px 17px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.topbar{padding:0 16px}.auth{grid-template-columns:1fr}.brand{display:none}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:22px}.content{padding:18px 12px}.topbar .search{max-width:150px}.user .userinfo{display:none}.pagehead{align-items:flex-start;flex-direction:column}.fieldrow{grid-template-columns:1fr}}
</style></head><body>
<section id="auth" class="auth"><div class="brand"><div class="brandmark"><b>S</b>SIAKAD Sekolah</div><div><h1>Kelola akademik dalam satu tempat</h1><div style="width:55px;height:4px;background:var(--gold);margin:22px 0"></div><p>Jadwal, presensi, nilai, dan raport untuk admin, guru, siswa, dan orang tua.</p></div><small>Platform akademik sekolah • Tahun ajaran 2026/2027</small></div><div class="authmain"><div class="authcard" id="authcard"></div></div></section>
<section id="app" class="app"><aside class="sidebar"><div class="logo"><b>S</b><span>SIAKAD</span></div><div class="navlabel">Menu <span id="rolelabel"></span></div><nav class="nav" id="nav"></nav><div class="sidebarbottom nav"><button onclick="logout()"><span class="ico">↪</span><span class="navtext">Keluar</span></button></div></aside><main class="main"><header class="topbar"><input class="search" placeholder="⌕  Cari..." oninput="globalSearch(this.value)"><div class="user"><div class="avatar" id="avatar">AS</div><div class="userinfo"><b id="username">Admin Sekolah</b><small id="userrole">Administrator</small></div><button class="ghost" onclick="showToast('Tidak ada notifikasi baru')">♧</button></div></header><div class="content" id="view"></div></main></section>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3 id="modtitle">Form</h3><button class="ghost" onclick="closeModal()">✕</button></div><div id="modbody"></div><div class="modalfoot"><button class="ghost" onclick="closeModal()">Batal</button><button onclick="saveModal()">Simpan</button></div></div></div><div class="toast" id="toast"></div>
<script>
const menus={
Admin:[['Dasbor','▦'],['Data master','▤'],['Kelola pengguna','♙'],['Jadwal pelajaran','▦'],['Laporan akademik','▥'],['Pengumuman','▣']],
Guru:[['Dasbor','▦'],['Presensi siswa','✓'],['Input nilai','▤'],['Materi dan tugas','▣'],['Jadwal mengajar','▦'],['Catatan siswa','☷']],
Siswa:[['Dasbor','▦'],['Jadwal pelajaran','▦'],['Nilai dan raport','▤'],['Presensi saya','✓'],['Tugas dan ujian','▣'],['Pengumuman','▣']],
'Orang tua':[['Dasbor','▦'],['Profil anak','♙'],['Nilai dan raport','▤'],['Presensi anak','✓'],['Tagihan SPP','▤'],['Pesan ke guru','✉']]
};
let role='Admin',page='Dasbor',modalAction=null, records={
users:[['Rina Wulandari','rina@sekolah.id','Guru','Aktif'],['Ahmad Fauzi','ahmad.f@mail.com','Siswa','Menunggu'],['Siti Aminah','siti.a@mail.com','Orang tua','Menunggu'],['Aditya Pratama','aditya@siswa.id','Siswa','Aktif'],['Doni Hartono','doni@sekolah.id','Guru','Aktif'],['Bella Kusuma','bella@siswa.id','Siswa','Aktif'],['Hendra Wijaya','hendra@mail.com','Orang tua','Aktif'],['Maya Sari','maya@sekolah.id','Guru','Nonaktif']],
classes:[['X IPA 1','Rina Wulandari',32,'R-101','Kelas X','Aktif'],['X IPA 2','Doni Hartono',31,'R-102','Kelas X','Aktif'],['X IPS 1','Maya Sari',30,'R-103','Kelas X','Aktif'],['XI IPA 1','Yusuf Hakim',33,'R-201','Kelas XI','Aktif'],['XI IPS 1','Lina Marlina',30,'R-202','Kelas XI','Aktif'],['XII IPA 1','Agus Salim',34,'R-301','Kelas XII','Aktif']],
students:['Aditya Pratama','Bella Kusuma','Citra Lestari','Dimas Saputra','Eka Wahyuni','Fajar Ramadhan']
};
const schedules=[['Matematika','Fisika','Sejarah','Matematika','Fisika','Sejarah'],['B. Inggris','Biologi','Seni budaya','B. Inggris','Biologi','Seni budaya'],['Kimia','PJOK','B. Indonesia','Kimia','PJOK','B. Indonesia'],['Sejarah','Matematika','Fisika','Sejarah','Matematika','Fisika'],['Seni budaya','B. Inggris','Biologi','Seni budaya','B. Inggris','Biologi']];
function auth(mode='login'){document.getElementById('auth').style.display='grid';document.getElementById('app').style.display='none';let c=document.getElementById('authcard');if(mode==='register'){c.innerHTML=`<h2>Buat akun baru</h2><p class="muted hint">Akun aktif setelah diverifikasi email atau admin.</p><form onsubmit="event.preventDefault();showToast('Registrasi berhasil. Silakan masuk.');auth('login')"><label>Nama lengkap</label><input required placeholder="Masukkan nama lengkap"><label>Email</label><input type="email" required placeholder="nama@email.com"><label>Peran</label><select id="regrole"><option>Guru</option><option>Siswa</option><option>Orang tua</option></select><label>Kata sandi</label><input type="password" minlength="8" required placeholder="Minimal 8 karakter"><label>Konfirmasi kata sandi</label><input type="password" required placeholder="Ulangi kata sandi"><p><input type="checkbox" required style="width:auto"> Saya menyetujui syarat dan ketentuan</p><button class="primary">Daftar</button></form><p class="hint">Sudah punya akun? <span class="link" onclick="auth('login')">Masuk</span></p>`}else if(mode==='forgot'){c.innerHTML=`<h2>Atur ulang kata sandi</h2><p class="muted hint">Masukkan email untuk menerima tautan pengaturan ulang.</p><form onsubmit="event.preventDefault();showToast('Tautan simulasi telah dikirim ke email.');auth('login')"><label>Email</label><input type="email" required placeholder="nama@email.com"><button class="primary">Kirim tautan</button></form><p class="hint"><span class="link" onclick="auth('login')">Kembali ke login</span></p>`}else{c.innerHTML=`<h2>Selamat datang kembali</h2><p class="muted hint">Masuk untuk membuka dasbor sesuai peran Anda.</p><form onsubmit="event.preventDefault();enter(document.getElementById('loginrole').value)"><label>Username atau email</label><input required id="loginemail" placeholder="nama@email.com" value="admin@sekolah.id"><label>Kata sandi</label><input required type="password" id="loginpass" placeholder="Masukkan kata sandi" value="admin123"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto"> Ingat saya</label><span class="link" onclick="auth('forgot')">Lupa sandi?</span></div><label>Masuk sebagai (simulasi prototipe)</label><select id="loginrole"><option>Admin</option><option>Guru</option><option>Siswa</option><option>Orang tua</option></select><p class="hint">Maksimal 3 kali percobaan sebelum akun dikunci sementara.</p><button class="primary">Masuk</button></form><p class="hint">Belum punya akun? <span class="link" onclick="auth('register')">Daftar</span></p>`}}
function enter(r){role=r;page='Dasbor';document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';document.getElementById('username').textContent={Admin:'Admin Sekolah',Guru:'Rina Wulandari',Siswa:'Aditya Pratama','Orang tua':'Hendra Wijaya'}[r];document.getElementById('userrole').textContent={Admin:'Administrator',Guru:'Guru matematika',Siswa:'Siswa kelas X IPA 1','Orang tua':'Orang tua Aditya'}[r];document.getElementById('avatar').textContent={Admin:'AS',Guru:'RW',Siswa:'AP','Orang tua':'HW'}[r];document.getElementById('rolelabel').textContent=r;renderNav();render()}
function logout(){auth('login')}
function renderNav(){document.getElementById('nav').innerHTML=menus[role].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span><span class="navtext">${n}</span></button>`).join('')}
function go(p){page=p;renderNav();render()}
function head(title,sub='',action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function panel(title,body,extra=''){return `<section class="panel"><div class="panelhead"><h3>${title}</h3>${extra}</div>${body}</section>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function btn(text,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}
function render(){let v=document.getElementById('view');let html='';const schedule=()=>`<div class="schedule"><div></div>${['Senin','Selasa','Rabu','Kamis','Jumat'].map(d=>`<div class="day">${d}</div>`).join('')}${['07.00','07.45','08.30','09.15','10.15','11.00'].map((t,i)=>`<div class="time">${t}</div>${[0,1,2,3,4].map(d=>`<div class="lesson">${schedules[d][i]}<small>Ruang R-10${d+1}</small></div>`).join('')}`).join('')}</div>`;
if(page==='Dasbor'&&role==='Admin'){html=head('Dasbor admin','Ringkasan tahun ajaran 2026/2027')+`<div class="grid stats">${stat('Total siswa','1.248','↑ Data tahun berjalan')}${stat('Total guru','86','Tenaga pendidik')}${stat('Kelas aktif','36','Seluruh tingkat')}${stat('Akun menunggu','12','Perlu diverifikasi')}</div><div class="grid cols">${panel('Verifikasi akun baru',table(['Nama','Peran','Tanggal daftar','Aksi'],[['Rina Wulandari','Guru','12 Okt 2026',btn('Setujui',"approve('Rina Wulandari')")],['Ahmad Fauzi','Siswa','12 Okt 2026',btn('Setujui',"approve('Ahmad Fauzi')")],['Siti Aminah','Orang tua','11 Okt 2026',btn('Setujui',"approve('Siti Aminah')")],['Budi Santoso','Siswa','11 Okt 2026',btn('Setujui',"approve('Budi Santoso')")]])),panel('Pengumuman terbaru',`<p><b>Jadwal UTS semester ganjil</b><br><small class="muted">Dibuat 12 Okt 2026</small></p><hr><p><b>Rapat wali murid kelas X</b><br><small class="muted">Dibuat 10 Okt 2026</small></p><hr><p><b>Libur peringatan hari besar</b><br><small class="muted">Dibuat 8 Okt 2026</small></p>`)}</div>`}
else if(page==='Data master'){html=head('Data master','Kelola kelas, mata pelajaran, dan tahun ajaran',`<button onclick="openForm('Tambah kelas',['Nama kelas','Wali kelas','Ruang','Tingkat'])">＋ Tambah kelas</button>`)+`<div class="tabs"><button class="active" onclick="tabData('kelas',this)">Kelas</button><button onclick="tabData('mapel',this)">Mata pelajaran</button><button onclick="tabData('tahun',this)">Tahun ajaran</button></div><div id="datatable">${classTable()}</div>`}
else if(page==='Kelola pengguna'){html=head('Kelola pengguna','Atur akun admin, guru, siswa, dan orang tua',`<button onclick="openForm('Tambah pengguna',['Nama lengkap','Email','Peran','Status'])">＋ Tambah pengguna</button>`)+`<div class="grid stats">${stat('Semua','1.372','Seluruh akun')}${stat('Guru','86','Tenaga pendidik')}${stat('Siswa','1.248','Peserta didik')}${stat('Orang tua','38','Wali siswa')}</div>${panel('Daftar pengguna',`<input id="userfilter" placeholder="Cari nama atau email..." oninput="filterUsers(this.value)" style="max-width:320px;margin-bottom:15px">${userTable()}`)}`}
else if(page==='Jadwal pelajaran'||page==='Jadwal mengajar'){html=head(page,'Jadwal kegiatan belajar mengajar',`<button onclick="showToast('Perubahan jadwal tersimpan (simulasi)')">Simpan jadwal</button>`)+`<div class="fieldrow" style="margin-bottom:18px"><div><label>Kelas</label><select><option>X IPA 1</option><option>X IPA 2</option><option>XI IPA 1</option></select></div><div><label>Semester</label><select><option>Ganjil 2026/2027</option><option>Genap 2026/2027</option></select></div><div><label>Tahun ajaran</label><input value="2026/2027"></div></div>${panel('Jadwal mingguan',schedule())}`}
else if(page==='Laporan akademik'){html=head('Laporan akademik','Ringkasan semester ganjil 2026/2027',`<button class="secondary" onclick="window.print()">Cetak laporan</button>`)+`<div class="grid stats">${stat('Rata-rata sekolah','82,4','Nilai akademik')}${stat('Kehadiran','95%','Tingkat kehadiran')}${stat('Layak naik kelas','97%','Hasil evaluasi')}${stat('Perlu remedial','38 siswa','Perlu tindak lanjut')}</div><div class="grid cols">${panel('Rata-rata nilai per kelas',table(['Kelas','Rata-rata'],[['X IPA 1','87,9'],['X IPA 2','84,2'],['X IPS 1','81,5'],['XI IPA 1','85,6'],['XI IPS 1','80,3'],['XII IPA 1','86,1'],['XII IPS 1','79,8']])),panel('Nilai terendah per mapel',table(['Mata pelajaran','Rata-rata'],[['Kimia','78,4'],['Fisika','79,9'],['Matematika','81,2'],['B. Inggris','82,6'],['Biologi','83,0'],['Sejarah','85,7']]))}</div>`}
else if(page==='Dasbor'&&role==='Guru'){html=head('Dasbor guru','Selamat pagi, Bu Rina')+`<div class="grid stats">${stat('Kelas diampu','5','Kelas aktif')}${stat('Jam mengajar hari ini','4 jam','Sesuai jadwal')}${stat('Tugas belum dinilai','23','Perlu diperiksa')}${stat('Siswa perlu remedial','6','Perlu pendampingan')}</div><div class="grid cols">${panel('Jadwal mengajar hari ini',table(['Jam','Kelas','Mata pelajaran','Ruang'],[['07.00','X IPA 1','Matematika','R-101'],['08.30','X IPA 2','Matematika','R-102'],['10.15','XI IPA 1','Matematika','R-201'],['11.00','X IPS 1','Matematika','R-103']])),panel('Perlu tindakan',`<p>Nilai UTS X IPA 2 belum lengkap<br><small class="muted">Tenggat 28 Okt 2026</small></p><hr><p>23 tugas menunggu penilaian<br><small class="muted">Bab fungsi kuadrat</small></p><hr><p>Presensi XI IPA 1 belum diisi<br><small class="muted">Jam ke-3 hari ini</small></p>`)}</div>`}

function classTable(){return table(['Kelas','Wali kelas','Jumlah siswa','Ruang','Tingkat','Status','Aksi'],records.classes.map((r,i)=>[...r.slice(0,6),btn('Ubah',`openEditClass(${i})`,'secondary')]))}
function userTable(){return table(['Nama','Email','Peran','Status','Aksi'],records.users.map((r,i)=>[r[0],r[1],r[2],`<span class="pill ${r[3]==='Menunggu'?'warn':r[3]==='Nonaktif'?'bad':''}">${r[3]}</span>`,btn('Ubah',`editUser(${i})`,'secondary')]))}
function tabData(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('datatable').innerHTML=t==='kelas'?classTable():t==='mapel'?table(['Kode','Mata pelajaran','Guru pengampu','Status'],[['MTK01','Matematika','Rina Wulandari','Aktif'],['BIN01','Bahasa Indonesia','Sari Dewi','Aktif'],['FIS01','Fisika','Hadi Prasetyo','Aktif']]):table(['Tahun ajaran','Semester','Status'],[['2026/2027','Ganjil','Aktif'],['2025/2026','Genap','Arsip']])}
function globalSearch(q){let rows=document.querySelectorAll('#view tbody tr');rows.forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function filterUsers(q){document.querySelectorAll('#view tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function showToast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.style.display='none',2600)}
function approve(n){let u=records.users.find(x=>x[0]===n);if(u)u[3]='Aktif';showToast(n+' disetujui');render()}
function openForm(title,fields){modalAction={type:'add',title};document.getElementById('modtitle').textContent=title;document.getElementById('modbody').innerHTML=fields.map(f=>`<label>${f}</label>${f.toLowerCase().includes('peran')?'<select><option>Guru</option><option>Siswa</option><option>Orang tua</option><option>Admin</option></select>':f.toLowerCase().includes('kelas')?'<select><option>X IPA 1</option><option>X IPA 2</option><option>XI IPA 1</option></select>':`<input placeholder="Masukkan ${f.toLowerCase()}">`}`).join('');document.getElementById('modalback').style.display='grid'}
function editUser(i){modalAction={type:'user',i};let u=records.users[i];document.getElementById('modtitle').textContent='Ubah pengguna';document.getElementById('modbody').innerHTML=`<label>Nama</label><input id="mname" value="${u[0]}"><label>Email</label><input id="memail" value="${u[1]}"><label>Peran</label><select id="mrole">${['Admin','Guru','Siswa','Orang tua'].map(x=>`<option ${x===u[2]?'selected':''}>${x}</option>`)}</select><label>Status</label><select id="mstatus">${['Aktif','Menunggu','Nonaktif'].map(x=>`<option ${x===u[3]?'selected':''}>${x}</option>`)}</select>`;document.getElementById('modalback').style.display='grid'}
function openEditClass(i){modalAction={type:'class',i};let c=records.classes[i];document.getElementById('modtitle').textContent='Ubah kelas';document.getElementById('modbody').innerHTML=['Nama kelas','Wali kelas','Jumlah siswa','Ruang','Tingkat','Status'].map((x,j)=>`<label>${x}</label><input id="c${j}" value="${c[j]}">`).join('');document.getElementById('modalback').style.display='grid'}
function closeModal(){document.getElementById('modalback').style.display='none'}
function saveModal(){if(modalAction?.type==='user'){let i=modalAction.i;records.users[i]=[mname.value,memail.value,mrole.value,mstatus.value]}else if(modalAction?.type==='class'){records.classes[modalAction.i]=[0,1,2,3,4,5].map(j=>document.getElementById('c'+j).value)}else showToast('Data berhasil ditambahkan (simulasi)');closeModal();render()}
function saveAttendance(){showToast('Presensi berhasil disimpan (simulasi)')}
function calcGrade(el){let tr=el.closest('tr'),vals=[...tr.querySelectorAll('input')].map(x=>x.value);let out=tr.querySelector('.grade');if(vals.every(x=>x!=='')){let n=vals.map(Number);out.textContent=(n[0]*.3+n[1]*.3+n[2]*.4).toFixed(1)}else out.textContent='Belum lengkap'}
function payment(){document.getElementById('modtitle').textContent='Konfirmasi pembayaran SPP';document.getElementById('modbody').innerHTML='<p>Tagihan Oktober 2026 sebesar <b>Rp450.000</b>.</p><label>Metode pembayaran</label><select><option>Transfer bank</option><option>QRIS</option><option>Bayar di tata usaha</option></select><div class="notice">Simulasi antarmuka. Tidak ada pembayaran atau transaksi sungguhan.</div>';modalAction={type:'payment'};document.getElementById('modalback').style.display='grid'}
function sendMessage(){let x=document.getElementById('msginput');if(!x.value.trim())return;let b=document.createElement('div');b.className='bubble mine';b.textContent=x.value;document.getElementById('messages').appendChild(b);x.value='';document.getElementById('messages').scrollTop=9999}
auth('login');
